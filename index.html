<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantum Mechanics Research</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Welcome to My Page</h1>
      <p><em>Quantum Mechanics Research Paper</em></p>
      <button type="button" id="alertButton">Click Me!</button>
    </header>

    <main>
      <form action="/action.php" method="post">
        <fieldset>
          <legend>Contact Details</legend>

          <p>
            <label for="name">Name</label><br />
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your name"
              required
            />
          </p>

          <p>
            <label for="email">Email</label><br />
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            />
          </p>
        </fieldset>

        <fieldset>
          <legend>Qualifications</legend>

          <p>
            <label for="ug">
              <input
                type="checkbox"
                id="ug"
                name="qualifications[]"
                value="UG"
              />
              Undergraduate (UG)
            </label>
          </p>

          <p>
            <label for="pg">
              <input
                type="checkbox"
                id="pg"
                name="qualifications[]"
                value="PG"
              />
              Postgraduate (PG)
            </label>
          </p>

          <p>
            <label for="phd">
              <input
                type="checkbox"
                id="phd"
                name="qualifications[]"
                value="PhD"
              />
              PhD
            </label>
          </p>
        </fieldset>

        <fieldset>
          <legend>Major Subject</legend>

          <p>
            <label for="major">Choose your major</label><br />
            <select id="major" name="major" required>
              <option value="" disabled selected>Select a subject</option>
              <option value="cs">Computer Science (BCA / MCA / B.Tech)</option>
              <option value="physics">Quantum Mechanics</option>
              <option value="mathematics">Mathematics</option>
              <option value="chemistry">Chemistry</option>
            </select>
          </p>
        </fieldset>

        <p><button type="submit" id="theme-toggle" class="theme-toggle"
           aria-label="Toggle dark/light mode">Submit <hr>
        <span class="icon sun">☀️</span>
         <span class="icon moon">🌙</span>
        </button>
          </p>
         </form>
        </main>

    <script src="script.js"></script>
  </body>
</html>
